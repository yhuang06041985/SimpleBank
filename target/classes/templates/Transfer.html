<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}">

    <style>
        #summary,
        #debit_card,
        #award_cash_card,
        #travel_credit_card {
            display: none;
        }
    </style>
</head>
<body>
<div class="container p-2">
    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>
    <form th:method="post" th:action="@{/transaction/transfer}">
        <div class="table border p-2">
            <div class="row">
                <div class="col-md-4">
                    <lable class="form-label">Money From</lable>
                </div>
                    <div class="col-5 p-1 ">
                        <label  class="form-label">Money to</label>
                    </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <select name="fromAccountId" class="form-select">
                        <option th:each="account : ${accounts}"
                                th:if="${account.accountType.title == 'Debit Card'}"
                                th:value="${account.id}"
                                th:text="${account.accountType.description}">
                        </option>
                    </select>
                </div>
                <div class="col-md-4 ">
                    <select name="toAccountId" class="form-select" required>
                        <option value="">--Select one Account==</option>
                        <option th:each="account : ${accounts}"
                                th:if="${account.accountType.title == 'Credit Card'}"
                                th:value="${account.id}"
                                th:text="${account.accountType.description}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Amount to Transfer</label>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <input name="amount" type="number" step="0.01"
                           class="form-control" required min="0.01">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-4>">
                    <button type="submit" class="btn btn-primary">Transfer</button>&nbsp;
                    <button type="reset" class="btn btn-secondary">reset</button>&nbsp;
                    <a th:href="@{/}" class="btn btn-info">Account</a>
                </div>
            </div>
    </form>
</div>
</body>
