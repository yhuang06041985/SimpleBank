<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}">

    <style>
        #summary,
        #debit_card,
        #award_cash_card,
        #travel_credit_card {
            display: none;
        }
    </style>
</head>
<body>
<main class="container m-3">
    <div th:if="${errorMessage}"
         class="alert alert-danger"
         role="alert">

        <span th:text="${errorMessage}"></span>

    </div>
    <form th:action="@{/transaction/save}"
          th:object="${transaction}"
          method="post">

        <!-- Keep the selected account ID -->
        <input type="hidden" name="accountId" th:value="${accountId}">

        <div class="mb-3">
            <label>Transaction Type</label>
            <select th:field="*{transactionType.id}" required class="form-control">
                <option value="">-- Select Type --</option>
                <option th:each="type : ${transactionTypes}"
                        th:value="${type.id}"
                        th:text="${type.typeName}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label>Transaction Date</label>
            <input type="datetime-local" required class="form-control"
                   th:attr="max=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm')} "
                   th:field="*{transactionDate}">
        </div>

        <div class="mb-3">
            <label>Company</label>
            <input type="text" class="form-control"
                   th:field="*{company}">
        </div>

        <div class="mb-3">
            <label>Description</label>
            <input type="text" class="form-control"
                   th:field="*{description}">
        </div>
        <div class="mb-3">
        </div>

        <div class="mb-3">
            <label>Amount</label>
            <input type="number"
                   th:field="*{amount}"
                   class="form-control"
                   required
                   min="0.01"
                   step="0.01">
        </div>
        <div class="text-danger"
             th:if="${#fields.hasErrors('amount')}"
             th:errors="*{amount}">
        </div>

        <div class="mb-3">
            <label>Company Phone Nbr</label>
            <input type="text" th:field="*{companyPhoneNbr}">
        </div>

        <button type="submit" class="btn btn-primary">Save</button>&nbsp;
        <a th:href="@{/}" class="btn btn-secondary">Back</a>

    </form>

</main>

</body>
</html>
