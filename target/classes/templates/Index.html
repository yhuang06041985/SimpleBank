
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo1 - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}">

    <style>
        #summary,
        #debit_card,
        #award_cash_card,
        #travel_credit_card {
            display: none;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="brand" th:href="@{/}">Demo1</a>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/about}">About</a>
</nav>

<main class="container m-3">
    <h3>BOA Awards Preferred Plus Tier Member </h3> <br>
    <div class="mb-4">
        <a th:href="@{/account/transfer}"
           class="btn btn-secondary btn-lg w-100 py-4">
            <h3 class="mb-1">Transfer Money</h3>
            <span>Move money between your accounts</span>

        </a>
    </div>
    <div class="py-2 bord">
        <div class="row">
            <div class="col-9 ">
                <h5>My Account</h5>
            </div>
            <div class="col-3">
                <h5>Balance</h5>
            </div>
        </div>
        <hr>
    <div th:each="account : ${accounts}" class="row py-3">
        <div class="col-9">
            <a th:href="@{/transaction/getlist/{id}(id=${account.id})}" style="text-decoration: none;">
                <span style="font-size: 20px"
                    th:text="${account.accountType.description}"></span>
            </a>
        </div>
        <div class="col-3">
            <span th:text="${'$' + #numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>
    </div>
    </div>


</main>

</body>
</html>
